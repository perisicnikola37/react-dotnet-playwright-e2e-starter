name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/*.png, packages/dashboard/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Landing page at the root, dashboard demo with dummy data under /demo/.
      - run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/preview.png docs/social-preview.png _site/
          node packages/dashboard/demo/build.mjs --site _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
