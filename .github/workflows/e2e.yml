name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund

      - name: Build the client package and the web app
        run: npm run build

      - name: Build
        run: dotnet build E2eStarter.sln -c Release

      - name: Install Playwright browsers
        run: pwsh tests/E2eStarter.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the E2E tests
        run: scripts/run-e2e.sh -- -c Release --no-build

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            tests/E2eStarter.E2E/bin/**/artifacts
            api.log
            web.log
