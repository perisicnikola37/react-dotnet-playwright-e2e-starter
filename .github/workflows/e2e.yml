name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund

      - name: Build the npm packages and the web app
        run: npm run build

      - name: Build
        run: dotnet build E2eStarter.sln -c Release

      - name: Install Playwright browsers
        run: pwsh tests/E2eStarter.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the E2E tests
        run: scripts/run-e2e.sh --report artifacts/e2e-report -- -c Release --no-build

      # Dashboard (index.html), standalone report.html, data.json and failure evidence of this run.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            artifacts/e2e-report
            api.log
            web.log
