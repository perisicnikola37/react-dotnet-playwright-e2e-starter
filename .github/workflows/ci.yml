name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build and test (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build (client package, then web app)
        run: npm run build

      - name: Test the client package
        run: |
          npm test --workspace packages/api-client
          npm test --workspace packages/react

  dotnet:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build E2eStarter.sln -c Release

      - name: Check for vulnerable packages
        run: |
          dotnet list E2eStarter.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Test the API
        run: dotnet test --project tests/E2eStarter.Api.Tests -c Release --no-build

      - name: Pack the NuGet package (dry run)
        run: |
          dotnet pack src/E2eStarter.Playwright -c Release --no-build -o artifacts/nuget
          dotnet pack src/E2eStarter.Reporters -c Release --no-build -o artifacts/nuget
          dotnet pack src/E2eStarter.AspNetCore -c Release --no-build -o artifacts/nuget
