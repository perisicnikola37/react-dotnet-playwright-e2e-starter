name: Publish

# Pushing a v* tag publishes the NuGet packages to nuget.org and the npm packages to npmjs.com and creates a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify the tag matches the package versions
        if: github.ref_type == 'tag'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 is '$2' but the tag is '$GITHUB_REF_NAME'."
              status=1
            fi
          }
          check Directory.Build.props "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          check packages/dashboard/package.json "$(node -p "require('./packages/dashboard/package.json').version")"
          check packages/react/package.json "$(node -p "require('./packages/react/package.json').version")"
          exit $status

      - name: Install, build and test
        run: |
          npm ci --no-fund
          npm run build
          npm test --workspace packages/react
          dotnet build E2eStarter.sln -c Release
          dotnet test --project tests/E2eStarter.Api.Tests -c Release --no-build
          dotnet test --project tests/E2eStarter.AspNetCore.Tests -c Release --no-build
          dotnet test --project tests/E2eStarter.Reporters.Tests -c Release --no-build

      - name: Pack
        run: |
          mkdir -p artifacts/npm artifacts/nuget
          npm pack --workspace packages/dashboard --pack-destination artifacts/npm
          npm pack --workspace packages/react --pack-destination artifacts/npm
          dotnet pack src/E2eStarter.Playwright -c Release --no-build -o artifacts/nuget
          dotnet pack src/E2eStarter.Reporters -c Release --no-build -o artifacts/nuget
          dotnet pack src/E2eStarter.AspNetCore -c Release --no-build -o artifacts/nuget

      - name: Publish the npm packages
        run: |
          # Re-running the workflow for a published version is fine; any other error fails the job.
          for pkg in artifacts/npm/*.tgz; do
            if ! npm publish "$pkg" --access public --provenance 2>publish.err; then
              cat publish.err >&2
              if grep -qE "E409|cannot publish over|previously published" publish.err; then
                echo "::warning::$pkg is already published."
              else
                exit 1
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: perisicnikola37

      - name: Publish the NuGet packages
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
              artifacts/nuget/*.nupkg artifacts/npm/*.tgz
