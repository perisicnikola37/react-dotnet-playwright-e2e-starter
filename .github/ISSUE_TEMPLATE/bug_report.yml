name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. scripts/run-e2e.sh --category Smoke
        2. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, .NET SDK (`dotnet --version`), Node.js (`node -v`), browser
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace
      description: Paste the failing output. Attach `trace.zip` or `screenshot.png` if you have them.
      render: shell
